# Build, test and deploy to GitHub Pages (spec 2.3).
# Any failing step stops the run, so nothing is deployed unless unit tests,
# the build and the E2E tests against the production build all pass.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only get read access unless they ask for more.
permissions:
  contents: read

# One deployment at a time; a newer push cancels a queued (not running) one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build (includes 404.html for SPA routes)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # CI=true makes playwright.config.js serve dist/ through
      # scripts/pages-server.js, which behaves like GitHub Pages.
      - name: E2E tests against the production build
        run: npm run test:e2e

      # Only when something failed: keep the Playwright report and traces
      # for debugging. Not deployed anywhere.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build-and-test
    # Manual runs on other branches only build and test; only main deploys.
    # (The github-pages environment is also restricted to main.)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only the deploy job may publish to Pages (OIDC token + Pages write).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
